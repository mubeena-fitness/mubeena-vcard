
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F3E9">
<title>Mubeena B | Lifestyle Fitness Coach</title>
<meta name="description" content="Connect with Mubeena B, Lifestyle Fitness Coach.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --ivory: #F8F3E9;
  --paper: #FFFCF6;
  --ink: #292820;
  --olive: #78816A;
  --muted: #817B70;
  --line: #E8E0D3;
}

* { box-sizing: border-box; }

body {
  min-height: 100vh;
  margin: 0;
  padding: 32px 18px;
  display: grid;
  place-items: center;
  background: var(--ivory);
  color: var(--ink);
  font-family: "DM Sans", Arial, sans-serif;
}

.card {
  width: min(100%, 460px);
  padding: 58px 38px 38px;
  text-align: center;
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: 0 22px 65px rgba(48,43,32,.06);
}

.eyebrow {
  margin: 0 0 20px;
  color: var(--olive);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(42px, 10vw, 54px);
  font-weight: 400;
  letter-spacing: -1.5px;
  line-height: 1.12;
}

.role {
  margin: 13px 0 0;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 1.1px;
}

.divider {
  width: 42px;
  height: 1px;
  margin: 32px auto 27px;
  background: var(--olive);
}

.intro {
  max-width: 300px;
  margin: 0 auto 34px;
  color: #6F6A60;
  font-family: "Playfair Display", Georgia, serif;
  font-size: 18px;
  line-height: 1.65;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.action {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 10px;
  border: 1px solid #D7D9CE;
  background: transparent;
  color: var(--ink);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .2px;
  transition: .2s ease;
}

.action.primary {
  border-color: var(--olive);
  background: var(--olive);
  color: #fffdf7;
}

.action:hover {
  border-color: var(--ink);
  background: var(--ink);
  color: #fffdf7;
}

.save-contact {
  margin-top: 28px;
  padding: 5px;
  border: 0;
  background: transparent;
  color: var(--olive);
  font: 500 12px "DM Sans", Arial, sans-serif;
  text-decoration: underline;
  text-underline-offset: 4px;
  cursor: pointer;
}

footer {
  margin-top: 37px;
  color: #A69F92;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

@media (max-width: 390px) {
  .card { padding: 48px 22px 32px; }
  .actions { gap: 9px; }
}
</style>
</head>

<body>
<main class="card">

  <p class="eyebrow">Lifestyle · Wellness</p>

  <h1>Mubeena B</h1>
  <p class="role">Lifestyle Fitness Coach</p>

  <div class="divider"></div>

  <p class="intro">
    Small steps. Stronger habits. A healthier you.
  </p>

  <nav class="actions" aria-label="Contact links">

    <a class="action primary" href="tel:+919080141919">
      Call
    </a>

    <a class="action"
       href="https://wa.me/919080141919"
       target="_blank" rel="noopener noreferrer">
      WhatsApp
    </a>

    <a class="action" href="mailto:trainwithmubi@gmail.com">
      Email
    </a>

    <a class="action"
       href="https://www.instagram.com/Mubi_fitness_15/"
       target="_blank" rel="noopener noreferrer">
      Instagram
    </a>

  </nav>

  <button class="save-contact" onclick="saveContact()">
    Save Contact
  </button>

  <footer>Connect · Move · Grow</footer>

</main>

<script>
function saveContact() {
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:Mubeena B",
    "N:B;Mubeena;;;",
    "TITLE:Lifestyle Fitness Coach",
    "TEL;TYPE=CELL:+919080141919",
    "EMAIL:trainwithmubi@gmail.com",
    "URL:https://www.instagram.com/Mubi_fitness_15/",
    "END:VCARD"
  ].join("\r\n");

  const blob = new Blob([vcard], {
    type: "text/vcard;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Mubeena-B.vcf";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
